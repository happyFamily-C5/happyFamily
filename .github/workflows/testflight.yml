name: Deploy to TestFlight

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Fastlane lane to run'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - staging_beta
      build_number:
        description: 'Custom Build Number (optional)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The release lane points at production, so a reset is deliberately
      # restricted to the explicitly selected staging_beta lane.
      - name: Install Supabase CLI for staging reset
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'staging_beta'
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: v2.116.0

      - name: Reset kumpul-staging data before Staging TestFlight build
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.lane == 'staging_beta'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_STAGING_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
          SUPABASE_STAGING_PROJECT_REF: tdpvtdblphojutjifdlc
          SUPABASE_STAGING_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_STAGING_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$SUPABASE_STAGING_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db reset --linked --no-seed
          node Scripts/reset_staging_supabase.mjs

      - name: Install code quality tools
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          if ! command -v swiftformat &> /dev/null; then
            brew install swiftformat
          fi
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi

      - name: Setup App Store Connect API Key
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'VQHBTPG3DZ' }}
        run: |
          set -euo pipefail
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${KEY_ID}.p8"

          if [ -n "$ASC_KEY_BASE64" ]; then
            printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          elif [[ "$ASC_KEY_CONTENT" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s' "$ASC_KEY_CONTENT" > "$KEY_PATH"
          elif [ -n "$ASC_KEY_CONTENT" ]; then
            printf '%s' "$ASC_KEY_CONTENT" | base64 --decode > "$KEY_PATH"
          else
            echo "::error::App Store Connect API key secret is missing"
            exit 1
          fi

          chmod 600 "$KEY_PATH"
          if ! openssl pkey -in "$KEY_PATH" -noout > /dev/null 2>&1; then
            echo "::error::App Store Connect API key is not a valid .p8 private key"
            exit 1
          fi

          echo "APP_STORE_CONNECT_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Run Code Quality Checks
        run: |
          bundle exec fastlane lint

      - name: Deploy to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'VQHBTPG3DZ' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          LANE="${{ github.event.inputs.lane || 'beta' }}"
          BUILD_NUM="${{ github.event.inputs.build_number || github.run_number }}"
          bundle exec fastlane $LANE build_number:"$BUILD_NUM"

      - name: Upload Build Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs
          path: |
            ~/Library/Logs/gym/*.log
            ~/Library/Logs/fastlane/
          retention-days: 7
