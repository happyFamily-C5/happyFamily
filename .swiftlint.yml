# SwiftLint Configuration

# Directories to include during linting
included:
  - App
  - Features
  - Core
  - DesignSystem
  - FashionModel
  - Tests
  - UITests

# Directories to exclude from linting
excluded:
  - Pods
  - Carthage
  - DerivedData
  - build
  - .build
  - Config
  - Scripts

# Opt-in rules to enable
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - identical_operands
  - legacy_multiple
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# Rules to disable
# SwiftFormat owns formatting; rules it already enforces are disabled here so the two
# tools can't demand opposite things (both run in `fastlane lint`).
disabled_rules:
  - todo
  - trailing_whitespace
  # SwiftFormat's `trailingCommas` adds these to multiline literals.
  - trailing_comma

# Configurable rules
line_length:
  warning: 140
  error: 180
  ignores_urls: true
  ignores_comments: true
  ignores_interpolated_strings: true

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 350
  error: 600

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    - k
    - to
    - db
