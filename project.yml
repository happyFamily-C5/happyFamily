name: happyFamily

options:
  bundleIdPrefix: com.academy.hendraaaa
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Staging: release
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig

targets:
  happyFamily:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - App
      - Features
      - Core
      - DesignSystem
    resources:
      - Resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    prebuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi
          if which swiftlint > /dev/null; then
            swiftlint lint --config "$SRCROOT/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed. Run 'brew install swiftlint' or 'Scripts/setup.sh'."
          fi
    scheme:
      testTargets:
        - happyFamilyTests
        - happyFamilyUITests

  happyFamilyTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - Tests
    dependencies:
      - target: happyFamily

  happyFamilyUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - UITests
    dependencies:
      - target: happyFamily
